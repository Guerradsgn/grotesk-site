<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111111">
  <title>Signing in to Grotesk</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/Geist-Latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/GeistSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* the sign-in hand-off: one centred moment, same world as the home */
    .handoff{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:100%;max-width:320px;margin:0 auto;padding:24px 16px;text-align:center}
    .handoff .name{margin-top:20px}
    .handoff .detail{margin-top:2px;color:var(--muted)}
    .handoff .invite{width:auto;padding:0 20px}
  </style>
</head>
<body>
  <main class="handoff">
    <img class="mark rise" src="../moth.svg" alt="" width="60" height="38">
    <h1 class="name rise" style="--i:1" id="title">You're in. Head back to Grotesk.</h1>
    <p class="detail rise" style="--i:2" id="detail">You can close this tab.</p>
    <a class="invite rise" style="--i:3" id="open" href="grotesk://auth"><span class="invite-label">Open Grotesk</span></a>
  </main>
  <div class="fx" aria-hidden="true"></div>
  <script>
    // The sign-in comes back here (?code=…, or an error). Hand everything to the
    // app at grotesk://auth, then tidy the address bar. Nothing is sent anywhere else.
    (function () {
      var params = new URLSearchParams(location.search);
      new URLSearchParams(location.hash.slice(1)).forEach(function (value, key) {
        if (!params.has(key)) params.set(key, value);
      });
      var query = params.toString();
      var target = "grotesk://auth" + (query ? "?" + query : "");
      document.getElementById("open").href = target;
      if (params.has("error") || params.has("error_description")) {
        document.getElementById("title").textContent = "Couldn't sign you in.";
        document.getElementById("detail").textContent = "Go back to Grotesk and try again.";
      }
      history.replaceState(null, "", location.pathname);
      if (query) location.href = target;
    })();
  </script>
</body>
</html>
